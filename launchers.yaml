# ============================================================================
# launchers.yaml — MANIFEST DOSTEPNYCH LAUNCHEROW
#
# Po co: launcher to MODUL. Dzis mamy jeden (factor-vm-win11), ale architektura
# przewiduje wiecej — np. instalacje bezposrednio na Ubuntu bez VM, albo wariant
# dla innego systemu. Ten manifest pozwala:
#   1. wybrac launcher interaktywnie (gdy bootstrap.yaml klienta nie wskazuje)
#   2. udokumentowac wymagania kazdego launchera
#   3. dodac nowy launcher BEZ zmiany kodu bootstrap.ps1
#
# JAK DODAC NOWY LAUNCHER:
#   1. utworz katalog <nazwa>/ z setup.ps1
#   2. dopisz wpis w ponizszej liscie
#   3. gotowe — bootstrap.ps1 sam go znajdzie i zaoferuje
#
# Pole 'default' wskazuje launcher uzywany, gdy klient nie ma bootstrap.yaml
# (np. instalacja testowa "dla kolegi" bez specyfikacji klienta).
# ============================================================================

version: "1.0"
default: factor-vm-win11

launchers:
  - name: factor-vm-win11
    label: "Windows 11 (maszyna wirtualna)"
    description: "Ubuntu w VirtualBox na Windows. Bezpieczne odizolowanie asystenta od systemu klienta."
    status: stable
    platform: windows
    requires:
      - "Windows 11 / 10 (64-bit)"
      - "16 GB RAM (zalecane 32 GB)"
      - "50 GB wolnego dysku"
      - "VirtualBox 7.1 (instalator pobierze)"
      - "Ubuntu 24.04 Server ISO (instalator pobierze)"
    setup: setup.ps1
    notes: |
      Domyslny launcher dla kancelarii. VM ma NAT (tylko porty 2222/8080
      forwardowane), wiec system klienta jest odizolowany od asystenta.
      Hermes dziala natywnie WEWNATRZ VM, nie w kontenerze.

